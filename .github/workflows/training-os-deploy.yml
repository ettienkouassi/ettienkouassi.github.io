# Déploiement TRAINING OS AI : image publiée sur GHCR, puis
#  - staging  : automatique sur la branche « release/staging » ou manuellement
#  - production : manuel, protégé par l'environnement GitHub « production » (validation obligatoire)
# Secrets requis par environnement : SSH_HOST, SSH_USER, SSH_KEY (clé privée de déploiement)
name: TRAINING OS AI — Déploiement

on:
  push:
    branches: ["release/staging"]
    paths: ["training-os/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement cible"
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}/trainingos:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push (runner + tools)
        working-directory: training-os
        run: |
          docker build --target runner -t "${{ steps.meta.outputs.tag }}" .
          docker build --target tools -t "${{ steps.meta.outputs.tag }}-tools" .
          docker push "${{ steps.meta.outputs.tag }}"
          docker push "${{ steps.meta.outputs.tag }}-tools"

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Migration puis redémarrage (zéro commande manuelle sur le serveur)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/trainingos
            export APP_IMAGE="${{ needs.image.outputs.tag }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "$APP_IMAGE" && docker pull "$APP_IMAGE-tools"
            # Sauvegarde avant migration
            docker compose --env-file .env.production exec -T backup sh /usr/local/bin/backup.sh
            docker run --rm --network trainingos_default --env-file .env.production \
              -e DATABASE_MIGRATION_URL="postgres://trainingos_owner:$(grep ^DB_OWNER_PASSWORD .env.production | cut -d= -f2-)@db:5432/trainingos" \
              "$APP_IMAGE-tools" npm run db:migrate
            docker compose --env-file .env.production up -d --no-build app
            sleep 10 && curl -fsS "https://$(grep ^APP_DOMAIN .env.production | cut -d= -f2-)/api/health"
