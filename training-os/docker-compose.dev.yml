# Base PostgreSQL locale pour le développement :  docker compose -f docker-compose.dev.yml up -d
name: trainingos-dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      OWNER_PASSWORD: owner_dev_pw
      APP_PASSWORD: app_dev_pw
    ports: ["5432:5432"]
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./deploy/postgres-init-test.sql:/docker-entrypoint-initdb.d/20-test.sql:ro
volumes:
  pgdata-dev:
